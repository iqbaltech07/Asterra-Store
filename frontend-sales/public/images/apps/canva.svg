<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="canva-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00C4CC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canva-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181F"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="canva-grad" x1="0%" y1="0%" x2="100%" y2="100%">
